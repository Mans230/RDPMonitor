name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Python regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Browser helper tests
        run: node --test tests/test_webconsole_user_flow.js
      - name: Verify dependency snapshot
        run: python -B scripts/lock_dependencies.py
