name: Windows validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
          architecture: x64
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install locked runtime dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install isolated Passkey test dependencies
        run: python -m pip install -r requirements-auth-test.txt
      - name: Python regression suite
        run: python -B -m unittest discover -s tests -v
      - name: Browser helper tests
        run: node --test tests/test_webconsole_user_flow.js tests/test_passkeys.js
      - name: Verify dependency snapshot
        run: python -B scripts/lock_dependencies.py

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: tests
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency:
      group: suite-stable-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.14'
      - name: Package validated runtime code
        run: python scripts/package_update.py rdpmonitor-update.zip $env:GITHUB_SHA $env:GITHUB_RUN_NUMBER
      - name: Publish stable suite release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $Current=gh api ('repos/'+$env:GITHUB_REPOSITORY+'/git/ref/heads/main') --jq '.object.sha'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify current main.' }
          if ($Current -ne $env:GITHUB_SHA) { Write-Output 'Superseded main build; no release published.'; exit 0 }
          $Tag='suite-'+$env:GITHUB_RUN_NUMBER+'-'+$env:GITHUB_SHA.Substring(0,12)
          gh release create $Tag rdpmonitor-update.zip --target $env:GITHUB_SHA --title ('Suite '+$Tag) --notes 'Validated bot and panel update. Configuration, tokens, TLS certificates, backups and runtime history are excluded.' --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
